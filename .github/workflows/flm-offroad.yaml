name: FLM offroad contracts

on:
  push:
    branches: [Dom, StarPilot, dom]
    paths:
      - 'openpilot/starpilot/flm/**'
      - 'openpilot/starpilot/lateral/**'
      - 'openpilot/starpilot/aol/**'
      - 'openpilot/starpilot/galaxy/web/js/flm*.js'
      - 'openpilot/starpilot/galaxy/tests/test_flm*.mjs'
      - 'tools/installer/**'
      - 'installer-dom*'
      - 'openpilot/starpilot/galaxy/drive_history.py'
      - 'openpilot/starpilot/galaxy/*route*.py'
      - 'openpilot/starpilot/galaxy/flm_learning_mode.py'
      - 'openpilot/starpilot/galaxy/tests/test_*route*.py'
      - 'openpilot/selfdrive/controls/lib/latcontrol*'
      - 'openpilot/selfdrive/controls/controlsd.py'
      - 'openpilot/system/manager/process_config.py'
      - 'openpilot/selfdrive/modeld/**'
      - 'openpilot/system/camerad/cameras/**'
      - 'openpilot/system/sensord/**'
      - 'openpilot/selfdrive/locationd/**'
      - 'msgq_repo/msgq/visionipc/**'
      - 'rednose_repo/rednose/helpers/**'
      - 'openpilot/starpilot/models/laboratory_runner.py'
      - 'openpilot/starpilot/models/tests/test_laboratory_runner.py'
      - '.github/workflows/flm-offroad.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full candidate commit SHA to qualify without creating a branch
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: flm-offroad-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  PYTHONPATH: ${{ github.workspace }}
  RAYLIB_BACKEND: headless

jobs:
  contracts:
    name: offroad backend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify exact source under test
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git rev-parse HEAD
          test -z "$SOURCE_SHA" || test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: ./tools/op.sh setup
      - name: Check all FLM and integrated controller source
        timeout-minutes: 1
        run: |
          ruff check openpilot/starpilot/flm openpilot/selfdrive/controls/controlsd.py openpilot/selfdrive/controls/lib/latcontrol_pid.py openpilot/selfdrive/controls/lib/latcontrol_torque.py openpilot/system/manager/process_config.py
          ty check openpilot/starpilot/flm openpilot/selfdrive/controls/controlsd.py openpilot/selfdrive/controls/lib/latcontrol_pid.py openpilot/selfdrive/controls/lib/latcontrol_torque.py openpilot/system/manager/process_config.py
      - name: Build native dependencies
        timeout-minutes: 10
        run: scons
      - name: Test producer capture, clocks, offroad recommendations, startup and rollback
        timeout-minutes: 5
        run: |
          tools/op.sh test \
            openpilot/starpilot/flm/tests/test_offroad_backend.py \
            openpilot/starpilot/flm/tests/test_offroad_coordinate_policy.py \
            openpilot/starpilot/flm/tests/test_offroad_retained_trials.py \
            openpilot/starpilot/flm/tests/test_offroad_process_lifecycle.py \
            openpilot/starpilot/flm/tests/test_route_recording_clocks.py \
            openpilot/starpilot/flm/tests/test_configured_route_recording.py \
            openpilot/starpilot/flm/tests/test_observed_maneuvers.py \
            openpilot/starpilot/flm/tests/test_pid_coordinate_proposals.py \
            openpilot/starpilot/flm/tests/test_offroad_equal_native_output.py \
            openpilot/starpilot/flm/tests/test_offroad_fault_isolation.py \
            openpilot/starpilot/flm/tests/test_offroad_long_partial.py \
            openpilot/starpilot/flm/tests/test_live_mode_selection.py \
            openpilot/starpilot/flm/tests/test_live_parked_finish.py \
            openpilot/starpilot/flm/tests/test_power_loss_recovery.py \
            openpilot/starpilot/flm/tests/test_full_route_review.py \
            openpilot/starpilot/flm/tests/test_route_tuning_consensus.py \
            openpilot/starpilot/flm/tests/test_route_tuning_import.py \
            openpilot/starpilot/flm/tests/test_route_pooled_tracking.py \
            openpilot/starpilot/flm/tests/test_live_parked_managed_progress.py \
            openpilot/starpilot/flm/tests/test_import_trial_integration.py \
            openpilot/starpilot/flm/tests/test_import_parked_lifecycle.py \
            openpilot/starpilot/flm/tests/test_faster_native_probe.py \
            openpilot/starpilot/flm/tests/test_probe_batch_preparation.py \
            openpilot/starpilot/flm/tests/test_live_tracking_probe_process.py \
            openpilot/starpilot/flm/tests/test_source_observation_report.py \
            openpilot/starpilot/flm/tests/test_convergence_preferences.py \
            openpilot/starpilot/flm/tests/test_aol_pedal_learning.py \
            openpilot/starpilot/flm/tests/test_aol_live_learning.py \
            openpilot/starpilot/flm/tests/test_live_trial_global_runtime.py \
            openpilot/starpilot/flm/tests/test_control_wire_fields.py \
            openpilot/starpilot/flm/tests/test_steering_compatibility.py \
            openpilot/starpilot/galaxy/tests/test_drive_history.py \
            openpilot/starpilot/galaxy/tests/test_drive_analysis.py \
            openpilot/starpilot/galaxy/tests/test_drive_stats.py \
            openpilot/starpilot/galaxy/tests/test_stream_route_review.py \
            openpilot/starpilot/galaxy/tests/test_route_reviews_resume.py \
            openpilot/starpilot/galaxy/tests/test_connect_route_stream.py \
            openpilot/starpilot/galaxy/tests/test_full_route_review_api.py \
            tools/installer/tests/test_static_installer.py \
            --json-output ci-results/flm-offroad.json
          .venv/bin/python -m pytest -q --import-mode=importlib \
            openpilot/starpilot/flm/tests/test_upstream_producer_transport.py \
            openpilot/starpilot/flm/tests/test_clock_resolution_budget.py \
            openpilot/starpilot/flm/tests/test_consumption_join_clocks.py \
            openpilot/starpilot/flm/tests/test_control_source_clock_recovery.py \
            openpilot/starpilot/flm/tests/test_drain_receipt_clock.py \
            openpilot/starpilot/flm/tests/test_event_admission_clock.py \
            openpilot/starpilot/models/tests/test_laboratory_runner.py \
            openpilot/starpilot/aol/tests/test_source_expiry_native_off.py \
            --junitxml=ci-results/flm-producer.xml
      - name: Test completed-drive and steering-result presentation
        timeout-minutes: 1
        run: |
          node openpilot/starpilot/galaxy/tests/test_flm_training_results.mjs
          node openpilot/starpilot/galaxy/tests/test_flm_tracking_results.mjs
          node openpilot/starpilot/galaxy/tests/test_flm.mjs
          node openpilot/starpilot/galaxy/tests/test_flm_learning_mode.mjs
          node openpilot/starpilot/galaxy/tests/test_flm_route_reviews.mjs
          node openpilot/starpilot/galaxy/tests/test_tuning_editor.mjs
          node openpilot/starpilot/galaxy/tests/test_settings_defaults.mjs
          node openpilot/starpilot/galaxy/tests/test_flm_ux_browser.mjs
      - name: Retain offroad contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flm-offroad-contracts
          path: |
            ci-results/flm-offroad.json
            ci-results/flm-producer.xml
          if-no-files-found: warn
